name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23", "1.24"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      # -race also enables checkptr, which catches invalid unsafe.Pointer
      # arithmetic. Without this the suite can be green while the package has
      # undefined behaviour in its strided frame buffer accessors.
      - name: Run tests with race detector
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
        run: go test -race ./...

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build all packages
        run: go build ./...

      - name: Build CLI tools
        run: |
          go build ./cmd/exrinfo
          go build ./cmd/exrheader
          go build ./cmd/exrcheck
          go build ./cmd/exrmaketiled
          go build ./cmd/exrmetrics
          go build ./cmd/exrmultipart
          go build ./cmd/exrmultiview
          go build ./cmd/exrenvmap
          go build ./cmd/exr2aces

  gate:
    name: Conformance gate and mutation harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config python3 \
            libopenjp2-tools zlib1g-dev libboost-dev libtiff-dev libpng-dev \
            libjpeg-dev

      # The distribution's OpenEXR predates HTJ2K, whose compression
      # identifiers arrived in 3.4. The gate compares this library's HTJ2K
      # output against the reference, so the reference has to be new enough to
      # have it; an older one would turn those rows into failures that say
      # nothing about this code.
      - name: Build OpenEXR from source
        run: |
          git clone --depth 1 --branch v3.4.0 \
            https://github.com/AcademySoftwareFoundation/openexr.git /tmp/openexr
          cmake -S /tmp/openexr -B /tmp/openexr/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DOPENEXR_BUILD_TOOLS=ON \
            -DOPENEXR_INSTALL_EXAMPLES=OFF
          cmake --build /tmp/openexr/build -j"$(nproc)"
          sudo cmake --install /tmp/openexr/build
          sudo ldconfig

      - name: Build OpenJPH
        run: |
          git clone --depth 1 https://github.com/aous72/OpenJPH.git /tmp/openjph
          cmake -S /tmp/openjph -B /tmp/openjph/build \
            -DCMAKE_BUILD_TYPE=Release -DOJPH_ENABLE_TIFF_SUPPORT=OFF
          cmake --build /tmp/openjph/build -j"$(nproc)"
          sudo cmake --install /tmp/openjph/build
          sudo ldconfig

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      # OpenImageIO has to be built against the OpenEXR above rather than
      # installed from the distribution. The packaged oiiotool links its own
      # older OpenEXR — 2.4.17 against a pre-HTJ2K release, measured on this
      # runner — and refuses every HTJ2K file this library writes with "Unknown
      # compression type in image header". That would fail the HTJ2K rows for a
      # reason that has nothing to do with this code.
      - name: Build OpenImageIO against that OpenEXR
        run: |
          git clone --depth 1 --branch v3.0.8.1 \
            https://github.com/AcademySoftwareFoundation/OpenImageIO.git /tmp/oiio
          cmake -S /tmp/oiio -B /tmp/oiio/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenImageIO_BUILD_MISSING_DEPS=all \
            -DUSE_PYTHON=OFF \
            -DBUILD_TESTING=OFF \
            -DOIIO_BUILD_TESTS=OFF \
            -DUSE_QT=OFF \
            -DUSE_OPENGL=OFF \
            -DINSTALL_DOCS=OFF
          cmake --build /tmp/oiio/build -j"$(nproc)"
          sudo cmake --install /tmp/oiio/build
          sudo ldconfig

      # The gate requires go build to print nothing at all, and a cold module
      # cache prints "go: downloading ..." to stderr. Fetching first keeps that
      # strictness meaningful instead of turning it into a CI artefact.
      - name: Prefetch modules
        run: go mod download

      - name: Report the oracles in use
        run: |
          echo "PATH=$PATH"
          exrheader --help 2>&1 | head -2 || true
          pkg-config --modversion OpenEXR || true
          oiiotool --version 2>&1 | head -1 || true
          ojph_expand 2>&1 | head -2 || true

      # STRICT makes a section that cannot find its oracle a failure instead of
      # a skip, so this job cannot pass by measuring nothing. It is the same
      # bargain the gate makes locally.
      - name: Run the conformance gate
        env:
          STRICT: "1"
        run: bash scripts/validate.sh

      # The gate says the code is right; the mutation harness says the gate
      # would notice if it stopped being right. Both or neither.
      - name: Run the mutation harness
        run: python3 scripts/mutation/run.py
